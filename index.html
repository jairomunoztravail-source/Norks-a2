<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Norsk 150</title><style>:root{--bg:#070e1f;--card:#112040;--card2:#1a2e5a;--text:#e8eefb;--muted:#8aa0c2;--ok:#5ee1a8;--bad:#ff6b6b}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}header{padding:16px;padding-top:calc(16px + env(safe-area-inset-top));background:rgba(7,14,31,.9);position:sticky;top:0;border-bottom:1px solid #1e3356}h1{margin:0;font-size:20px}.lesson{background:var(--card);border:1px solid #1e3356;border-radius:16px;padding:14px;margin:10px 16px;display:flex;justify-content:space-between;align-items:center}.lesson.locked{opacity:.5}.lesson.done{border-color:var(--ok);background:rgba(94,225,168,.1)}.badge{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:800;background:var(--card2)}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid #1e3356;border-radius:20px;padding:20px;margin:16px}.prompt{font-size:32px;font-weight:900;margin:12px 0}.choice{padding:16px;background:var(--card2);border:2px solid #223a61;border-radius:14px;margin:8px 0;font-size:18px}.choice.ok{border-color:var(--ok)}.choice.bad{border-color:var(--bad)}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800}.btn-primary{background:var(--ok);color:#052;width:100%}.btn-sec{background:var(--card2);color:var(--text);border:1px solid #223a61}.mic{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #ffcc33, #ff8a33);border:0;font-size:30px}.mic.listening{animation:pulse 1s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,204,51,.7)}70%{box-shadow:0 0 0 18px rgba(255,204,51,0)}100%{box-shadow:0 0 0 0 rgba(255,204,51,0)}}.progress{height:6px;background:#1a2d55;border-radius:6px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--ok),#ffcc33);width:0%;transition:width .4s}.feedback{margin-top:12px;padding:12px;border-radius:12px}.feedback.ok{background:rgba(94,225,168,.12);border:1px solid #1a6b4a}.feedback.bad{background:rgba(255,107,107,.12);border:1px solid #7f1d1d}</style></head><body><header><h1>🇳🇴 Norsk - nous-memes</h1><div style="display:flex;gap:8px;margin-top:8px"><span id="xp" style="background:#1a2e5a;padding:6px 12px;border-radius:20px">⚡ <b>0</b> XP</span><span id="total" style="color:#8aa0c2"></span></div></header><main><div id="home" class="view active"><div class="card"><p id="hero"></p><div class="progress"><div class="bar" id="gbar"></div></div></div><div id="lessons"></div></div><div id="study" class="view"><div style="display:flex;justify-content:space-between;padding:0 16px"><button class="btn btn-sec" onclick="showHome()">←</button><span><span id="idx">1</span>/<span id="tot">5</span></span><span id="cat" style="color:#8aa0c2"></span></div><div class="card"><div class="progress"><div class="bar" id="bar"></div></div><div id="type" style="color:#8aa0c2;margin-top:10px"></div><div id="prompt" class="prompt"></div><div id="answers"></div><div id="micZone" style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px"><button id="micBtn" class="mic">🎤</button><small id="micStatus" style="color:#8aa0c2">Dis le mot</small><div id="transcript" style="font-weight:700"></div></div><div id="fb" class="feedback" style="display:none"></div><div style="display:flex;gap:8px;margin-top:16px"><button id="speakBtn" class="btn btn-sec">🔊</button><button id="nextBtn" class="btn btn-primary" style="display:none;flex:1">Suivant →</button></div></div></div></main><script>

"050","no":"en gate","fr":"rue","cat":"L4 Suite","exNo":"en gate er bra.","exFr":"rue est bien.","level":4},{"id":"051","no":"et hotell","fr":"hotel","cat":"L4 Suite","exNo":"et hotell er bra.","exFr":"hotel est bien.","level":4},{"id":"052","no":"et sykehus","fr":"hopital","cat":"L4 Suite","exNo":"et sykehus er bra.","exFr":"hopital est bien.","level":4},{"id":"053","no":"en buss","fr":"bus","cat":"L4 Suite","exNo":"en buss er bra.","exFr":"bus est bien.","level":4},{"id":"054","no":"en bil","fr":"voiture","cat":"L4 Suite","exNo":"en bil er bra.","exFr":"voiture est bien.","level":4}];
const STORE="norsk_nous_memes";let prog={};try{prog=JSON.parse(localStorage.getItem(STORE)||"{}")}catch(e){prog={}};function save(){localStorage.setItem(STORE,JSON.stringify(prog))}function getP(id){return prog[id]||{c:0,i:0}}function upd(id,ok){let p=getP(id);if(ok)p.c++;else p.i++;prog[id]=p;save()}function lessonStats(lv){let ws=WORDS.filter(w=>w.level===lv);let done=ws.filter(w=>getP(w.id).c>0).length;return{total:ws.length,done}}function isUnlocked(lv){if(lv===1)return true;let prev=lessonStats(lv-1);return prev.done>=Math.ceil(prev.total*0.7)}function renderHome(){let lvls=[...new Set(WORDS.map(w=>w.level))].sort((a,b)=>a-b);let html='';let totalDone=0,totalAll=WORDS.length;lvls.forEach(lv=>{let s=lessonStats(lv);totalDone+=s.done;let unlock=isUnlocked(lv);let pct=Math.round(s.done/s.total*100);let cat=WORDS.find(w=>w.level===lv).cat;let badge=!unlock?'🔒':s.done===s.total?'✅':' '+pct+'%';html+=`<div class="lesson ${unlock?'':'locked'} ${s.done===s.total?'done':''}" onclick="${unlock?`startLesson(${lv})`:''}"><div><b>${cat}</b><br><small style="color:#8aa0c2">${s.done}/${s.total}</small></div><span class="badge">${badge}</span></div>`});document.getElementById('lessons').innerHTML=html;document.getElementById('total').textContent=totalAll+' mots';document.getElementById('gbar').style.width=(totalDone/totalAll*100)+'%';document.getElementById('hero').innerHTML=totalDone+'/'+totalAll+' mots<br><small style="color:#8aa0c2">Tout dans un seul fichier. Avec oss selv = nous-memes! 🎤 pour prononciation.</small>';let xp=Object.values(prog).reduce((a,p)=>a+p.c*10,0);document.getElementById('xp').innerHTML='⚡ <b>'+xp+'</b> XP';}let session=[],pos=0,cur=null;function startLesson(lv){let ws=WORDS.filter(w=>w.level===lv);let withP=ws.map(w=>({w,p:getP(w.id)})).sort((a,b)=>(a.p.c-b.p.c)||(b.p.i-a.p.i));session=withP.slice(0,8).map(x=>x.w);pos=0;show('study');renderQ()}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id))}function showHome(){show('home');renderHome()}function norm(s){return (s||'').toLowerCase().trim().replace(/[.,!?;:]/g,' ').replace(/\s+/g,' ').trim()}function strip(s){return s.replace(/^(en|ei|et|å)\s+/i,'').trim()}function renderQ(){if(pos>=session.length){alert('Leçon finie!');showHome();return}let v=session[pos];let t=Math.random()<0.5?"speak":"fr-no";cur={v,t,answered:false};document.getElementById('idx').textContent=pos+1;document.getElementById('tot').textContent=session.length;document.getElementById('cat').textContent=v.cat;document.getElementById('bar').style.width=(pos/session.length*100)+'%';document.getElementById('fb').style.display='none';document.getElementById('nextBtn').style.display='none';document.getElementById('answers').innerHTML='';if(t==='fr-no'){document.getElementById('type').textContent='Comment dit-on:';document.getElementById('prompt').textContent=v.fr;let opts=[v.no,...WORDS.filter(x=>x.id!==v.id).sort(()=>.5-Math.random()).slice(0,3).map(x=>x.no)];let shuf=[...opts].sort(()=>.5-Math.random());document.getElementById('answers').innerHTML=shuf.map(o=>`<div class="choice" data-v="${o}">${o}</div>`).join('');document.querySelectorAll('.choice').forEach(el=>{el.onclick=()=>{if(cur.answered)return;let ok=norm(el.dataset.v)===norm(v.no);el.classList.add(ok?'ok':'bad');grade(ok,v.no)}})}else{document.getElementById('type').textContent='Dis-le:';document.getElementById('prompt').innerHTML=v.no+'<br><small style="color:#8aa0c2">'+v.fr+'</small>';document.getElementById('answers').innerHTML='<small style="color:#8aa0c2">🎤 Appuie sur le micro et dis le mot</small>';}}function grade(ok,ans){cur.answered=true;upd(cur.v.id,ok);let fb=document.getElementById('fb');fb.style.display='block';fb.className='feedback '+(ok?'ok':'bad');fb.innerHTML=ok?`✅ <b>${ans}</b>`: `❌ C'était <b>${ans}</b>`;document.getElementById('nextBtn').style.display='block';}document.getElementById('nextBtn').onclick=()=>{pos++;renderQ()};document.getElementById('speakBtn').onclick=()=>{let u=new SpeechSynthesisUtterance(cur.v.no);u.lang='nb-NO';speechSynthesis.speak(u)};let recog=null;try{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recog=new SR();recog.lang='nb-NO';recog.onstart=()=>{document.getElementById('micBtn').classList.add('listening')};recog.onend=()=>{document.getElementById('micBtn').classList.remove('listening')};recog.onresult=(e)=>{let txt=e.results[0][0].transcript;document.getElementById('transcript').textContent=txt;let ok=norm(txt)===norm(cur.v.no)||norm(txt).includes(norm(cur.v.no));grade(ok,cur.v.no)};}}catch(e){}document.getElementById('micBtn').onclick=()=>{if(!recog){alert('Micro non supporté, utilise 🔊');return}recog.start()};renderHome();</script></body></html>
