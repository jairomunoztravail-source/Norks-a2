<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Norsk 150 - Fix</title><style>body{margin:0;background:#070e1f;color:#fff;font-family:system-ui;padding:16px}.card{background:#112040;border-radius:16px;padding:16px;margin:10px 0}.choice{padding:14px;background:#1a2e5a;border-radius:12px;margin:8px 0;border:2px solid #223a61}.ok{border-color:#5ee1a8}.bad{border-color:#ff6b6b}.btn{padding:14px;border-radius:12px;border:0;font-weight:800;width:100%;background:#5ee1a8;color:#052}</style></head><body>
<h1>🇳🇴 Norsk Progressif - FIX</h1>
<div id="home"><div id="hero" class="card"></div><div id="list"></div></div>
<div id="q" style="display:none"><div class="card"><div id="cat" style="color:#8aa0c2"></div><h1 id="pr" style="font-size:30px"></h1><div id="ans"></div><div id="fb"></div><button id="nx" class="btn" style="display:none;margin-top:12px" onclick="nextQ()">Suivant →</button><button class="btn" style="margin-top:8px;background:#222;color:#fff" onclick="goHome()">←</button></div></div>
<script>
const WORDS=[
{id:1,no:"jeg",fr:"je",lv:1,cat:"L1 je/tu/nous-memes"},
{id:2,no:"du",fr:"tu",lv:1,cat:"L1 je/tu/nous-memes"},
{id:3,no:"vi",fr:"nous",lv:1,cat:"L1 je/tu/nous-memes"},
{id:4,no:"oss selv",fr:"nous-memes",lv:1,cat:"L1 je/tu/nous-memes"},
{id:5,no:"hun",fr:"elle",lv:1,cat:"L1 je/tu/nous-memes"},
{id:6,no:"han",fr:"il",lv:1,cat:"L1 je/tu/nous-memes"},
{id:7,no:"mamma",fr:"maman",lv:2,cat:"L2 famille"},
{id:8,no:"pappa",fr:"papa",lv:2,cat:"L2 famille"},
{id:9,no:"bror",fr:"frere",lv:2,cat:"L2 famille"},
{id:10,no:"soster",fr:"soeur",lv:2,cat:"L2 famille"},
{id:11,no:"bestemor",fr:"grand-mere",lv:2,cat:"L2 famille"},
{id:12,no:"bestefar",fr:"grand-pere",lv:2,cat:"L2 famille"},
{id:13,no:"en koffert",fr:"une valise",lv:3,cat:"L3 valise & maison"},
{id:14,no:"kofferten min",fr:"ma valise",lv:3,cat:"L3 valise & maison"},
{id:15,no:"kofferten din",fr:"ta valise",lv:3,cat:"L3 valise & maison"},
{id:16,no:"en liten koffert",fr:"une petite valise",lv:3,cat:"L3 valise & maison"},
{id:17,no:"en stor koffert",fr:"une grande valise",lv:3,cat:"L3 valise & maison"},
{id:18,no:"et hus",fr:"maison",lv:3,cat:"L3 valise & maison"},
{id:19,no:"et lite hus",fr:"petite maison",lv:3,cat:"L3 valise & maison"},
{id:20,no:"huset vart",fr:"notre maison",lv:3,cat:"L3 valise & maison"},
{id:21,no:"hvor er kofferten?",fr:"ou est la valise?",lv:4,cat:"L4 phrases"},
{id:22,no:"jeg har en koffert",fr:"j'ai une valise",lv:4,cat:"L4 phrases"},
{id:23,no:"vi har to kofferter",fr:"nous avons 2 valises",lv:4,cat:"L4 phrases"},
{id:24,no:"kofferten er i huset",fr:"la valise est dans la maison",lv:4,cat:"L4 phrases"}
];
let prog=JSON.parse(localStorage.getItem("p2")||"{}");
function save(){localStorage.setItem("p2",JSON.stringify(prog))}
function stats(lv){let w=WORDS.filter(x=>x.lv==lv);return{tot:w.length,done:w.filter(x=>prog[x.id]).length}}
function renderHome(){
let html="";[1,2,3,4].forEach(lv=>{
let s=stats(lv);let unlock=lv==1||stats(lv-1).done>=2;
let name=WORDS.find(w=>w.lv==lv).cat;
html+=`<div class="card" style="${unlock?'':'opacity:.4'}" onclick="${unlock?`start(${lv})`:''}"><b>${name}</b> ${s.done}/${s.tot} ${unlock?'':'🔒'}</div>`;
});
document.getElementById("list").innerHTML=html;
document.getElementById("hero").innerHTML=Object.keys(prog).length+"/"+WORDS.length+" mots appris<br><small style='color:#8aa0c2'>Maintenant avec VRAIE valise: en koffert, kofferten min, to kofferter</small>";
}
let sess=[],pos=0,cur;
function goHome(){document.getElementById("home").style.display="block";document.getElementById("q").style.display="none";renderHome()}
function start(lv){sess=WORDS.filter(w=>w.lv==lv);pos=0;document.getElementById("home").style.display="none";document.getElementById("q").style.display="block";show()}
function show(){
if(pos>=sess.length){alert("Bravo! Lecon finie");goHome();return}
cur=sess[pos];document.getElementById("cat").textContent=cur.cat;
document.getElementById("pr").textContent=cur.fr;
document.getElementById("fb").textContent="";document.getElementById("nx").style.display="none";
let opts=[cur.no].concat(WORDS.filter(w=>w.id!=cur.id).sort(()=>.5-Math.random()).slice(0,3).map(w=>w.no)).sort(()=>.5-Math.random());
document.getElementById("ans").innerHTML=opts.map(o=>`<div class="choice" onclick="check(this,'${o.replace(/'/g,"")}')">${o}</div>`).join("");
}
function check(el,val){
let ok=val==cur.no;
el.classList.add(ok?"ok":"bad");
document.getElementById("fb").textContent=ok?"✅ "+cur.no:"❌ C'etait: "+cur.no;
prog[cur.id]=ok?1:0;save();
document.getElementById("nx").style.display="block";
}
function nextQ(){pos++;show()}
renderHome();
</script></body></html>
